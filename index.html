<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            margin: 0;
            padding: 1.5rem 1rem 4rem;
            box-sizing: border-box;
            font-family: monospace;
            flex-direction: column;
            gap: 0.5rem;
            background: #1a1a1a;
            color: #eeeeee;
            transition: background 0.3s, color 0.3s;
            overflow-y: auto;
        }

        body.light {
            background: #fff;
            color: rgb(0, 120, 140);
        }

        #date {
            font-size: clamp(0.8rem, 3vw, 2rem);
            text-align: center;
        }

        #clock {
            font-size: clamp(3rem, 16vw, 16rem);
            text-align: center;
            line-height: 1;
        }

        #elapsed {
            font-size: clamp(1rem, 4.5vw, 5rem);
            text-align: center;
        }

        #log {
            font-size: clamp(0.8rem, 2vw, 2rem);
            text-align: center;
            opacity: 0.7;
        }

        #switcher {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            width: min(92vw, 380px);
            margin-top: 0.8rem;
        }

        #notes {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #eee;
            font-family: monospace;
            font-size: 0.9rem;
            padding: 0.5em 0.6em;
            border-radius: 6px;
            resize: none;
            height: 3.2em;
        }

        body.light #notes { background: #f0f0f0; border-color: #bbb; color: rgb(0, 120, 140); }
        #notes::placeholder { opacity: 0.35; }

        #client-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .client-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #eee;
            font-family: monospace;
            font-size: clamp(0.75rem, 3.5vw, 0.9rem);
            padding: 0.7em 0.3em;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.1s;
            text-align: center;
        }

        body.light .client-btn { background: #e8e8e8; border-color: #bbb; color: rgb(0, 120, 140); }
        .client-btn:hover { background: #3a3a3a; border-color: #666; }
        body.light .client-btn:hover { background: #d8d8d8; }
        .client-btn:active { background: #444; }

        #other-wrap {
            display: none;
            gap: 0.5rem;
            align-items: center;
        }

        #other-wrap.open { display: flex; }

        #other-input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #eee;
            font-family: monospace;
            font-size: 0.9rem;
            padding: 0.4em 0.6em;
            border-radius: 6px;
        }

        body.light #other-input { background: #f0f0f0; border-color: #bbb; color: rgb(0, 120, 140); }

        #other-log-btn {
            background: none;
            border: 1px solid currentColor;
            color: inherit;
            font-family: monospace;
            font-size: 0.9rem;
            padding: 0.4em 0.8em;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0.8;
        }

        #other-log-btn:hover { opacity: 1; }

        #toggle {
            position: fixed;
            bottom: clamp(12px, 3vw, 24px);
            right: clamp(12px, 3vw, 24px);
            background: none;
            border: 2px solid currentColor;
            color: inherit;
            font-family: monospace;
            font-size: clamp(0.75rem, 2vw, 1.1rem);
            padding: 0.4em 0.9em;
            border-radius: 999px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        #toggle:hover { opacity: 1; }
    </style>
    <script src="slog.js"></script>
</head>

<body>
    <div id="date"></div>
    <div id="clock">00:00:00</div>
    <div id="elapsed"></div>
    <div id="log"></div>

    <div id="switcher">
        <textarea id="notes" placeholder="notes..."></textarea>
        <div id="client-grid">
            <button class="client-btn" onclick="pickClient('Music')">Music</button>
            <button class="client-btn" onclick="pickClient('Finity')">Finity</button>
            <button class="client-btn" onclick="pickClient('MuseScore')">MuseScore</button>
            <button class="client-btn" onclick="pickClient('Jobs')">Jobs</button>
            <button class="client-btn" onclick="pickClient('J Master')">J Master</button>
            <button class="client-btn" onclick="pickClient('Home')">Home</button>
            <button class="client-btn" onclick="pickClient('Family')">Family</button>
            <button class="client-btn" onclick="pickClient('Self')">Self</button>
            <button class="client-btn" onclick="pickClient('FSU')">FSU</button>
            <button class="client-btn" onclick="pickClient('Chill')">Chill</button>
            <button class="client-btn" onclick="pickClient('Train')">Train</button>
            <button class="client-btn" onclick="pickOther()">Other</button>
        </div>
        <div id="other-wrap">
            <input id="other-input" type="text" placeholder="client name" />
            <button id="other-log-btn" onclick="submitOther()">log</button>
        </div>
    </div>

    <button id="toggle" onclick="toggleMode()">light</button>

    <script>
        let clockInTime = null;
        let currentCenter = '';
        let currentNotes = '';

        function pad(n) { return String(n).padStart(2, '0'); }
        const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            document.getElementById('date').textContent =
                `${DAYS[now.getDay()]} ${pad(now.getMonth() + 1)} ${pad(now.getDate())} ${now.getFullYear()}`;
            if (clockInTime) {
                const elapsed = Math.floor((now - clockInTime) / 1000);
                const h = Math.floor(elapsed / 3600);
                const m = Math.floor((elapsed % 3600) / 60);
                const s = elapsed % 60;
                document.getElementById('elapsed').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
            }
        }

        function toggleMode() {
            const light = document.body.classList.toggle('light');
            document.getElementById('toggle').textContent = light ? 'dark' : 'light';
            localStorage.setItem('theme', light ? 'light' : 'dark');
        }

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
            document.getElementById('toggle').textContent = 'dark';
        }

        setInterval(updateClock, 1000);
        updateClock();

        fetchLastRow().then(row => {
            if (!row || row.length === 0) return;
            const [timestamp, center, notes] = row;
            clockInTime = new Date(timestamp);
            currentCenter = center || '';
            currentNotes = notes || '';
            updateLog();
        });

        function updateLog() {
            document.getElementById('log').textContent =
                currentNotes ? `${currentCenter} — ${currentNotes}` : currentCenter;
        }

        function pickOther() {
            document.getElementById('other-wrap').classList.add('open');
            document.getElementById('other-input').focus();
        }

        function submitOther() {
            const client = document.getElementById('other-input').value.trim();
            if (client) pickClient(client);
        }

        async function pickClient(client) {
            const notes = document.getElementById('notes').value.trim();
            const timestamp = new Date().toISOString();
            try {
                await postNewRow(timestamp, client, notes);
                clockInTime = new Date(timestamp);
                currentCenter = client;
                currentNotes = notes;
                document.getElementById('notes').value = '';
                document.getElementById('other-wrap').classList.remove('open');
                document.getElementById('other-input').value = '';
                updateLog();
            } catch (e) {
                alert('Failed to log: ' + e.message);
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && document.getElementById('other-wrap').classList.contains('open')) {
                submitOther();
            }
        });
    </script>
</body>

</html>
