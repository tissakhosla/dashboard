<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            margin: 0;
            font-family: monospace;
            flex-direction: column;
            background: #1a1a1a;
            color: #eeeeee;
            transition: background 0.3s, color 0.3s;
        }

        body.light {
            background: #fff;
            color: rgb(0, 120, 140);
        }

        #date {
            font-size: clamp(0.8rem, 3vw, 3rem);
            text-align: center;
            margin-bottom: 0.5rem;
        }

        #clock {
            font-size: clamp(3rem, 18vw, 20rem);
            text-align: center;
        }

        #elapsed {
            font-size: clamp(1.2rem, 5.5vw, 6rem);
            text-align: center;
        }

        #log-wrap {
            display: flex;
            align-items: center;
            gap: 0.4em;
            justify-content: center;
            font-size: clamp(0.8rem, 2.2vw, 2.5rem);
            margin-top: 1rem;
        }

        #switch-btn {
            background: none;
            border: none;
            color: inherit;
            font-family: monospace;
            font-size: 0.8em;
            cursor: pointer;
            opacity: 0.5;
            padding: 0;
            transition: opacity 0.2s;
        }

        #switch-btn:hover { opacity: 1; }

        #modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #modal-overlay.open { display: flex; }

        #modal {
            background: #2a2a2a;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: min(90vw, 320px);
            font-family: monospace;
        }

        body.light #modal {
            background: #f5f5f5;
            border-color: #ccc;
        }

        #modal h3 { margin: 0; font-size: 1.1rem; }

        #modal label {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        #modal input {
            background: #1a1a1a;
            border: 1px solid #555;
            color: #eee;
            font-family: monospace;
            font-size: 1rem;
            padding: 0.4em 0.6em;
            border-radius: 4px;
            opacity: 1;
        }

        body.light #modal input {
            background: #fff;
            border-color: #aaa;
            color: rgb(0, 120, 140);
        }

        #modal .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        #modal .modal-actions button {
            background: none;
            border: 1px solid currentColor;
            color: inherit;
            font-family: monospace;
            font-size: 0.9rem;
            padding: 0.3em 0.8em;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.7;
        }

        #modal .modal-actions button:hover { opacity: 1; }
        #modal .modal-actions button.primary { opacity: 1; font-weight: bold; }

        #toggle {
            position: fixed;
            bottom: clamp(12px, 3vw, 24px);
            right: clamp(12px, 3vw, 24px);
            background: none;
            border: 2px solid currentColor;
            color: inherit;
            font-family: monospace;
            font-size: clamp(0.75rem, 2vw, 1.1rem);
            padding: 0.4em 0.9em;
            border-radius: 999px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        #toggle:hover {
            opacity: 1;
        }
    </style>
    <script src="slog.js"></script>
</head>

<body>
    <div id="date"></div>
    <div id="clock">00:00:00</div>
    <div id="elapsed"></div>
    <div id="log-wrap">
        <span id="log"></span>
        <button id="switch-btn" onclick="openModal()">↺</button>
    </div>
    <button id="toggle" onclick="toggleMode()">light</button>

    <div id="modal-overlay">
        <div id="modal">
            <h3>Switch Task</h3>
            <label>Client<input id="modal-center" type="text" /></label>
            <label>Task<input id="modal-notes" type="text" /></label>
            <div class="modal-actions">
                <button onclick="closeModal()">cancel</button>
                <button class="primary" onclick="submitTask()">log</button>
            </div>
        </div>
    </div>
    <script>
        let clockInTime = null;
        let currentCenter = '';
        let currentNotes = '';

        function pad(n) { return String(n).padStart(2, '0'); }
        const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            document.getElementById('date').textContent =
                `${DAYS[now.getDay()]} ${pad(now.getMonth() + 1)} ${pad(now.getDate())} ${now.getFullYear()}`;
            if (clockInTime) {
                const elapsed = Math.floor((now - clockInTime) / 1000);
                const h = Math.floor(elapsed / 3600);
                const m = Math.floor((elapsed % 3600) / 60);
                const s = elapsed % 60;
                document.getElementById('elapsed').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
            }
        }

        function toggleMode() {
            const light = document.body.classList.toggle('light');
            document.getElementById('toggle').textContent = light ? 'dark' : 'light';
            localStorage.setItem('theme', light ? 'light' : 'dark');
        }

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
            document.getElementById('toggle').textContent = 'dark';
        }

        setInterval(updateClock, 1000);
        updateClock();

        fetchLastRow().then(row => {
            if (!row || row.length === 0) return;
            const [timestamp, center, notes] = row;
            clockInTime = new Date(timestamp);
            currentCenter = center || '';
            currentNotes = notes || '';
            updateLog();
        });

        function updateLog() {
            document.getElementById('log').textContent =
                currentNotes ? `${currentCenter} — ${currentNotes}` : currentCenter;
        }

        function openModal() {
            document.getElementById('modal-center').value = currentCenter;
            document.getElementById('modal-notes').value = currentNotes;
            document.getElementById('modal-overlay').classList.add('open');
            document.getElementById('modal-notes').focus();
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('open');
        }

        async function submitTask() {
            const center = document.getElementById('modal-center').value.trim();
            const notes = document.getElementById('modal-notes').value.trim();
            if (!center) return;
            const timestamp = new Date().toISOString();
            try {
                await postNewRow(timestamp, center, notes);
                clockInTime = new Date(timestamp);
                currentCenter = center;
                currentNotes = notes;
                updateLog();
                closeModal();
            } catch (e) {
                alert('Failed to log: ' + e.message);
            }
        }

        document.getElementById('modal-overlay').addEventListener('click', e => {
            if (e.target === document.getElementById('modal-overlay')) closeModal();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'Enter' && document.getElementById('modal-overlay').classList.contains('open')) {
                submitTask();
            }
        });
    </script>
</body>

</html>
