<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="slog.js"></script>
</head>

<body>
    <div id="clock">00:00:00</div>
    <div id="date"></div>
    <div id="elapsed"></div>
    <div id="log"></div>

    <div id="switcher">
        <textarea id="notes" placeholder="notes..."></textarea>
        <div id="client-grid">
            <button class="client-btn" onclick="pickClient('AET')">AET</button>
            <button class="client-btn" onclick="pickClient('Finity')">Finity</button>
            <button class="client-btn" onclick="pickClient('Iru')">Iru</button>
            <button class="client-btn" onclick="pickClient('Music')">Music</button>
            <button class="client-btn" onclick="pickClient('Train')">Train</button>
            <button class="client-btn" onclick="pickClient('FSU')">FSU</button>
            <button class="client-btn" onclick="pickClient('Home')">Home</button>
            <button class="client-btn" onclick="pickClient('Ruby')">Ruby</button>
            <button class="client-btn" onclick="pickClient('Stephanie')">Stephanie</button>
            <button class="client-btn" onclick="pickClient('Me')">Me</button>
            <button class="client-btn" onclick="pickClient('Chill')">Chill</button>
            <button class="client-btn" onclick="pickClient('Scheme')">Scheme</button>
        </div>
        <button class="client-btn" onclick="pickOther()">Other</button>
        <div id="other-wrap">
            <input id="other-input" type="text" placeholder="client name" />
            <button id="other-log-btn" onclick="submitOther()">log</button>
        </div>
    </div>

    <button id="toggle" onclick="toggleMode()">light</button>

    <script>
        let clockInTime = null;
        let currentCenter = '';
        let currentNotes = '';

        function pad(n) { return String(n).padStart(2, '0'); }
        const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            document.getElementById('date').textContent =
                `${DAYS[now.getDay()]} ${pad(now.getMonth() + 1)} ${pad(now.getDate())} ${now.getFullYear()}`;
            if (clockInTime) {
                const elapsed = Math.floor((now - clockInTime) / 1000);
                const h = Math.floor(elapsed / 3600);
                const m = Math.floor((elapsed % 3600) / 60);
                const s = elapsed % 60;
                document.getElementById('elapsed').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
            }
        }

        function toggleMode() {
            const light = document.body.classList.toggle('light');
            document.getElementById('toggle').textContent = light ? 'dark' : 'light';
            localStorage.setItem('theme', light ? 'light' : 'dark');
        }

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
            document.getElementById('toggle').textContent = 'dark';
        }

        setInterval(updateClock, 1000);
        updateClock();

        fetchLastRow().then(row => {
            if (!row || row.length === 0) return;
            const [timestamp, center, notes] = row;
            clockInTime = new Date(timestamp);
            currentCenter = center || '';
            currentNotes = notes || '';
            updateLog();
            setActiveClient(currentCenter);
        });

        function updateLog() {
            document.getElementById('log').textContent =
                currentNotes ? `${currentCenter} — ${currentNotes}` : currentCenter;
        }

        function setActiveClient(client) {
            document.querySelectorAll('.client-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === client);
            });
        }

        function pickOther() {
            document.getElementById('other-wrap').classList.add('open');
            document.getElementById('other-input').focus();
        }

        function submitOther() {
            const client = document.getElementById('other-input').value.trim();
            if (client) pickClient(client);
        }

        async function pickClient(client) {
            const notes = document.getElementById('notes').value.trim();
            const timestamp = new Date().toISOString();
            try {
                await postNewRow(timestamp, client, notes);
                clockInTime = new Date(timestamp);
                currentCenter = client;
                currentNotes = notes;
                document.getElementById('notes').value = '';
                document.getElementById('other-wrap').classList.remove('open');
                document.getElementById('other-input').value = '';
                updateLog();
            } catch (e) {
                alert('Failed to log: ' + e.message);
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && document.getElementById('other-wrap').classList.contains('open')) {
                submitOther();
            }
        });
    </script>
</body>

</html>
